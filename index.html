      const [accounts, setAccounts] = useState(() => {

        try {
          const permSaved = localStorage.getItem(PRIMARY_STORAGE_KEY);

            const oldSaved = localStorage.getItem(oldKey);

      const [newForm, setNewForm] = useState({ accountId: "acc_main", code: "", name: "", lots: 1, avgCost: "", prevHigh: "", mode: "swing", stopLossPct: 10.0, stopMaType: "none", stopLogicMode: "or", maBreakBufferPct: 3.0 });

      // 載入 FinMind 全市場名稱字典

        const loadAllTwStockNames = async () => {
          try {
            const res = await fetch("https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo");
            if (res.ok) {
              const json = await res.json();

                const map = { ...BUILTIN_STOCK_DIR };
                json.data.forEach(item => { if (item.stock_id && item.stock_name) map[item.stock_id] = item.stock_name; });

            headers: { "Content-Type": "text/plain;charset=utf-8" }

      // ============================================================================
      // 🌐 全方位自動抓取引擎 (FinMind / Yahoo)
      // ============================================================================
      const fetchSingleStockMarketData = async (stockItem) => {
        const cleanCode = String(stockItem.code).trim().toUpperCase();

        const nowTimeStr = new Date().toLocaleTimeString("zh-TW", { hour12: false });

        let fetchedName = BUILTIN_STOCK_DIR[cleanCode] || stockDict[cleanCode] || "";
        if (!fetchedName && stockItem.name && !stockItem.name.includes("自動抓取") && !stockItem.name.includes("抓取中")) fetchedName = stockItem.name;

        let priceResult = null; let instNote = stockItem.institutionalNote; let margNote = stockItem.marginNote; let autoBranchNote = stockItem.branchNote;
        let revenueNote = stockItem.revenueNote; let epsNote = stockItem.epsNote; let newsList = Array.isArray(stockItem.newsItems) ? stockItem.newsItems : [];

        const startD130 = new Date(Date.now() - 135 * 86400000).toISOString().slice(0, 10);

          try {
            const infoRes = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=${encodeURIComponent(cleanCode)}`);

          } catch (e) {}
        }

            if (isTechStopTriggered) { if (todayClose <= techBreakTriggerPrice) { reasons.push(`跌破 ${baseMALabel} 觸發價`); shortTags.push(`跌破 ${baseMALabel}`); } else if (s.twoDaysBelowMA) { reasons.push(`連續兩日收盤站不回 ${baseMALabel}`); shortTags.push(`連2日破 ${baseMALabel}`); } }
            actionSubTag = "已觸及底線，請停損";
            actionReason = `強制砍單：${reasons.join(" ＋ ")}。${!isFundStopTriggered && isTechStopTriggered ? `💡 若您只想以買入價 -${customLossPct}% 為標準，請將停損規則改為「純看%數」。` : "觸及資金停損底線，拒絕凹單！"}`;
          } else if (isTrailingTriggered) {
            actionCommand = "【💰 減碼停利】"; actionBadgeType = "take_profit"; actionSubTag = `高點回落 ${drawdownFromPeakPct.toFixed(1)}%`; actionReason = `移動停利觸發：最高價 ${updatedHigh.toFixed(2)} 回落達 5%，強制鎖住獲利！`;
          } else if (isBreakevenTriggered) {
            actionCommand = "【💰 保本停利】"; actionBadgeType = "take_profit"; actionSubTag = `跌破保本線`; actionReason = `曾獲利達 +${peakGainPct.toFixed(2)}%，現跌破保本線 (${breakevenPrice.toFixed(2)}元)，嚴禁由盈轉虧！`;
          } else if (isChipVetoTriggered) {
            actionCommand = "【⚠️ 逢高避險】"; actionBadgeType = "chip_veto"; actionSubTag = "籌碼敗壞一票否決"; actionReason = `籌碼敗壞：出現融資暴增+法人大賣或隔日沖鎖漲停，強制逢高避險！`;
          }

          let chipScore = 0; if (s.chipForeignTrustBuy) chipScore += 2.0; if (s.chipMarginDownShortUp) chipScore += 1.0; if (s.chipNoDayTrader) chipScore += 1.0; if (s.vetoMarginSpikeForeignSell) chipScore = Math.max(0, chipScore - 2.0); if (s.vetoDayTraderLockLimitUp) chipScore = Math.max(0, chipScore - 1.0);
          let techScore = 0; const refMA = baseMA > 0 ? baseMA : ma20; if (s.maBullishAlign && todayClose >= refMA) techScore += 1.5; if (s.priceVolGood) techScore += 1.5; if (isTechStopTriggered) techScore = 0; else if (todayClose < refMA) techScore = Math.max(0, techScore - 1.5);
          const fundScore = s.fundRevGrowthTheme ? 2.0 : 0.5; const sectorScore = s.sectorHotFocus ? 1.0 : 0.0;
          const totalScore = Number((chipScore + techScore + fundScore + sectorScore).toFixed(1));

          return {
            ...s, ma60, customLossPct, stopMaType, stopLogicMode, maBufferPct, hardStopPriceByCost, updatedHigh, pnlPct, peakGainPct, drawdownFromPeakPct,
            totalCostAmt, marketValueAmt, unrealizedPnL, baseMA, baseMALabel, techBreakTriggerPrice, defaultHardStopPrice, trailingStopPrice, breakevenPrice, defenseLinePrice, defenseLineLabel,

                            <td className="p-3 text-center font-mono">{s.lots}</td>
                            <td className="p-3 text-right font-mono">{s.avgCost.toFixed(2)}</td>
                            <td className="p-3 text-right font-mono font-bold text-white">{s.todayClose.toFixed(2)}</td>
                            <td className="p-3 text-right font-mono text-amber-300">{s.updatedHigh.toFixed(2)}</td>
                            <td className={`p-3 text-right font-mono font-bold ${getPnLColor(s.pnlPct)}`}>{s.pnlPct >= 0 ? "+" : ""}{s.pnlPct.toFixed(2)}%</td>
                            <td className="p-3" onClick={e=>e.stopPropagation()}>
                              <div className="flex items-center gap-1">
                                <span className="text-rose-400">-</span><input type="number" step="0.5" value={s.customLossPct} onChange={e=>updateStockRuleById(s.id, "stopLossPct", Number(e.target.value))} className="w-10 bg-transparent text-[11px] text-white text-center border-b border-slate-700 focus:outline-none" /><span className="text-slate-400 text-[10px]">%</span>
                                <select value={s.stopMaType} onChange={e=>updateStockRuleById(s.id, "stopMaType", e.target.value)} className="bg-slate-950 border border-slate-700 rounded px-1 py-1 text-[11px] text-amber-200"><option value="none">純看%數</option><option value="ma10">破10MA</option><option value="ma20">破20MA</option><option value="ma60">破60MA</option></select>
                                {s.stopMaType !== "none" && (<select value={s.stopLogicMode} onChange={e=>updateStockRuleById(s.id, "stopLogicMode", e.target.value)} className="bg-slate-950 border border-slate-700 rounded px-1 py-1 text-[10px] text-slate-300"><option value="or">或(OR)</option><option value="and">且(AND)</option></select>)}
                              </div>
                            </td>
                            <td className="p-3">
                              <span className={`inline-block px-2.5 py-1 rounded text-xs border ${getCommandBadgeStyle(s.actionBadgeType)}`}>{s.actionCommand}</span>
                              <div className="text-[10px] text-slate-400 mt-1">{s.actionSubTag}</div>
                            </td>
                            <td className="p-3 text-center" onClick={e=>e.stopPropagation()}>
                              <div className="flex justify-center gap-1">
                                <button onClick={e=>handleSyncSingleStock(s, e)} disabled={fetchingIds[s.id]} className="px-2 py-1 bg-blue-950/70 border border-blue-500/40 text-blue-300 rounded text-xs">🔄</button>
                                <button onClick={()=>{setSelectedStockId(s.id); setIsEditDrawerOpen(true);}} className="px-2 py-1 bg-slate-800 border border-slate-700 text-slate-200 rounded text-xs">✏️</button>
                                <button onClick={e=>handleDeleteStock(s.id, s.code, s.name, e)} className="px-2 py-1 bg-rose-950/50 border border-rose-500/30 text-rose-300 rounded text-xs">🗑️</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                      {filteredStocks.length === 0 && (<tr><td colSpan="10" className="p-8 text-center text-slate-500">此分類無庫存。</td></tr>)}
                    </tbody>
                  </table>
                </div>
              </section>

              {/* 手動微調抽屜 */}
              {isEditDrawerOpen && selectedStock && (
                <section className="bg-slate-900 border-2 border-amber-500/40 rounded-2xl p-5 space-y-4">
                  <div className="flex justify-between border-b border-slate-800 pb-2"><h3 className="text-sm font-bold text-amber-300">✏️ 參數微調：【{selectedStock.code} {selectedStock.name}】</h3><button onClick={()=>setIsEditDrawerOpen(false)} className="text-slate-400">✕ 關閉</button></div>
                  <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 text-xs">
                    <div><label className="text-slate-400 block mb-1">股票名稱</label><input type="text" value={selectedStock.name} onChange={e=>updateSelectedStockField("name", e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" /></div>
                    <div><label className="text-slate-400 block mb-1">張數</label><input type="number" value={selectedStock.lots} onChange={e=>updateSelectedStockField("lots", Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" /></div>
                    <div><label className="text-slate-400 block mb-1">平均成本</label><input type="number" value={selectedStock.avgCost} onChange={e=>updateSelectedStockField("avgCost", Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" /></div>
                    <div><label className="text-slate-400 block mb-1">今日收盤價</label><input type="number" value={selectedStock.todayClose} onChange={e=>updateSelectedStockField("todayClose", Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" /></div>
                    <div><label className="text-slate-400 block mb-1">20MA / 60MA</label><div className="flex gap-1"><input type="number" value={selectedStock.ma20} onChange={e=>updateSelectedStockField("ma20", Number(e.target.value))} className="w-1/2 bg-slate-950 border border-slate-700 rounded px-1 text-white"/><input type="number" value={selectedStock.ma60} onChange={e=>updateSelectedStockField("ma60", Number(e.target.value))} className="w-1/2 bg-slate-950 border border-slate-700 rounded px-1 text-white"/></div></div>
                    <div><label className="text-rose-300 block mb-1">破線緩衝(%)</label><input type="number" step="0.5" value={selectedStock.maBreakBufferPct} onChange={e=>updateSelectedStockField("maBreakBufferPct", Number(e.target.value))} className="w-full bg-slate-950 border border-rose-500/40 rounded px-2 py-1.5 text-white" /></div>
                  </div>
                  <div className="text-xs">
                    <label className="text-slate-400 block mb-1">手動分點備註 (若填寫則覆蓋系統自動推算)</label>
                    <input type="text" value={selectedStock.branchNote} onChange={e=>updateSelectedStockField("branchNote", e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white" />
                  </div>
                </section>
              )}

              {/* 🔍 二、個股四維度深度診斷 */}
              {selectedStock && (
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
                  <div className="flex justify-between border-b border-slate-800 pb-3">
                    <h2 className="text-sm font-bold">🔍 深度診斷：<span className="text-amber-300">【{selectedStock.code} {selectedStock.name}】</span></h2>
                    <span className="text-xs px-2 py-1 bg-slate-950 border border-slate-700 rounded-full text-amber-400">總評 {selectedStock.totalScore.toFixed(1)}分</span>
                  </div>
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 text-xs">
                    <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-4 space-y-2">
                      <div className="font-bold text-slate-200 border-b border-slate-800 pb-2">📊 籌碼面透視 ({selectedStock.chipScore.toFixed(1)}分)</div>
                      <div className="text-slate-300 space-y-1">
                        <div><span className="text-slate-400">• 法人：</span>{selectedStock.institutionalNote}</div>
                        <div><span className="text-slate-400">• 資券：</span>{selectedStock.marginNote}</div>
                        <div className="pt-2 border-t border-slate-800/80"><span className="text-slate-400">• 主力分點：</span><div className="text-emerald-300 mt-1">{selectedStock.branchNote}</div></div>
                      </div>
                    </div>
                    <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-4 space-y-2">
                      <div className="font-bold text-slate-200 border-b border-slate-800 pb-2">📈 技術與停損 ({selectedStock.techScore.toFixed(1)}分)</div>
                      <div className="text-slate-300 space-y-1 font-mono">
                        <div className="flex justify-between"><span className="text-slate-400">收盤/最高：</span><span>{selectedStock.todayClose.toFixed(2)} / {selectedStock.updatedHigh.toFixed(2)}</span></div>
                        <div className="flex justify-between"><span className="text-slate-400">5MA/10MA：</span><span>{selectedStock.ma5.toFixed(2)} / {selectedStock.ma10.toFixed(2)}</span></div>
                        <div className="flex justify-between"><span className="text-slate-400">20MA/60MA：</span><span className="text-amber-300">{selectedStock.ma20.toFixed(2)} / {selectedStock.ma60.toFixed(2)}</span></div>
                        <div className="pt-2 border-t border-slate-800/80 font-sans">
                          {selectedStock.stopMaType === "none" ? <span className="text-blue-300">已設純資金停損，無破線問題。</span> : (selectedStock.todayClose >= selectedStock.baseMA ? <span className="text-emerald-400">站穩 {selectedStock.baseMALabel} 之上</span> : <span className="text-rose-400 font-bold">🚨 跌破 {selectedStock.baseMALabel} 觸發價！</span>)}
                        </div>
                      </div>
                    </div>
                    <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-4 space-y-2">
                      <div className="font-bold text-slate-200 border-b border-slate-800 pb-2">📰 基本面與新聞 ({(selectedStock.fundScore+selectedStock.sectorScore).toFixed(1)}分)</div>
                      <div className="text-slate-300 space-y-1">
                        <div><span className="text-amber-300">• 營收：</span>{selectedStock.revenueNote}</div>
                        <div><span className="text-emerald-300">• 估值：</span>{selectedStock.epsNote}</div>
                        <div className="pt-2 border-t border-slate-800/80">
                          <span className="text-slate-400">• 最新新聞：</span>
                          {(selectedStock.newsItems || []).map((n, i) => (<a key={i} href={n.link} target="_blank" className="block text-blue-300 hover:text-amber-300 truncate mt-1">🔗 {n.title}</a>))}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              )}

              {/* ⚡ 三、冷酷風控官的明日操作劇本 */}
              {selectedStock && (
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-3">
                  <h2 className="text-sm font-bold text-rose-300">⚡ 三、明日操作劇本 — 【{selectedStock.code} {selectedStock.name}】</h2>
                  <div className="p-3 bg-rose-950/35 border border-rose-500/40 rounded text-xs text-rose-100"><strong className="text-rose-400">🧠 當頭棒喝：</strong>{selectedStock.actionReason}</div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs mt-2">
                    <div className="p-3 bg-slate-950/80 border border-emerald-500/30 rounded"><div className="font-bold text-emerald-400 mb-1">🟢 續抱條件</div><span className="text-slate-300">守穩 5MA ({selectedStock.ma5.toFixed(2)}元) 紀律續抱。</span></div>
                    <div className="p-3 bg-slate-950/80 border border-amber-500/30 rounded"><div className="font-bold text-amber-300 mb-1">🟡 停利條件</div><span className="text-slate-300">衝高爆量長上影線，逢高減碼 1/3~1/2。</span></div>
                    <div className="p-3 bg-slate-950/80 border border-rose-500/40 rounded"><div className="font-bold text-rose-400 mb-1">🔴 停損條件</div><span className="text-slate-300">跌破底線 <u className="font-bold">{selectedStock.defenseLinePrice.toFixed(2)}元</u>，市價清倉不留戀！</span></div>
                  </div>
                </section>
              )}

              {/* ☁️ Google Sheets 跨裝置雲端同步中心 */}
              <section className="bg-slate-900 border-2 border-blue-500/40 rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h2 className="text-sm font-bold text-blue-300">☁️ Google Sheets 跨裝置雲端同步中心</h2>
                </div>
                <div className="space-y-3">
                  <p className="text-xs text-slate-400">1. 請在電腦與手機的瀏覽器中，貼上您專屬的 <b>Google Apps Script</b> 網頁應用程式網址。<br/>2. 電腦編輯完庫存後點擊 <b>「上傳」</b>；手機開啟後點擊 <b>「下載」</b> 即可完美同步所有帳號與持股。</p>
                  <input type="text" value={cloudUrl} onChange={e => setCloudUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="w-full bg-slate-950 border border-blue-500/50 rounded-lg px-3 py-2 text-xs text-blue-100 focus:outline-none focus:border-blue-400" />
                  <div className="flex flex-col sm:flex-row gap-3 pt-2">
                    <button onClick={handlePushToCloud} className="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition">⬆️ 上傳至雲端 (電腦端備份)</button>
                    <button onClick={handlePullFromCloud} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition">⬇️ 從雲端下載 (手機端還原)</button>
                  </div>
                </div>
              </section>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
