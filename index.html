<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>華爾街量化風控官 × 台股籌碼操盤手系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: #020617; color: #f8fafc; padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .title-group { display: flex; align-items: center; gap: 10px; }
    .title { font-size: 22px; font-weight: 900; background: linear-gradient(to right, #f87171, #fde047, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .btn-group { display: flex; gap: 10px; }
    .btn { padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    .btn-blue { background: rgba(37, 99, 235, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); }
    .btn-blue:hover { background: rgba(37, 99, 235, 0.4); }
    .btn-green { background: #059669; color: #ffffff; }
    .btn-green:hover { background: #10b981; }

    /* Card Section */
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    .card-header { padding: 12px 16px; background: rgba(30, 41, 59, 0.6); border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 16px; }

    /* Table */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { padding: 12px; background: #020617; color: #94a3b8; font-weight: 600; border-bottom: 1px solid #1e293b; }
    td { padding: 12px; border-bottom: 1px solid #1e293b; }
    tr.stock-row { cursor: pointer; transition: background 0.15s; }
    tr.stock-row:hover { background: rgba(30, 41, 59, 0.5); }
    tr.stock-row.active { background: rgba(51, 65, 85, 0.8); }

    /* Badges & Tags */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-profit { color: #f87171; font-weight: bold; font-family: monospace; }
    .badge-loss { color: #34d399; font-weight: bold; font-family: monospace; }
    .badge-hold { background: rgba(6, 78, 59, 0.5); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
    .badge-stop { background: rgba(136, 19, 55, 0.7); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.6); animation: pulse 1.5s infinite; }
    .badge-take { background: rgba(120, 53, 15, 0.6); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.5); }
    .tag-type { font-size: 10px; background: #1e293b; color: #cbd5e1; padding: 2px 5px; border-radius: 4px; border: 1px solid #334155; margin-right: 6px; }

    /* Diagnosis Grid */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 12px; }
    .diag-box { background: rgba(2, 6, 23, 0.7); border: 1px solid #1e293b; border-radius: 8px; padding: 14px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
    .diag-box-header { display: flex; justify-content: space-between; font-weight: bold; color: #f1f5f9; }
    .diag-score { color: #fbbf24; font-family: monospace; }
    .diag-list { display: flex; flex-direction: column; gap: 4px; color: #94a3b8; }
    .diag-list span { color: #e2e8f0; }

    /* Script Plans */
    .script-box { background: rgba(76, 5, 25, 0.25); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: 8px; padding: 12px; font-size: 12px; color: #fecdd3; line-height: 1.6; }
    .plan-card { background: rgba(2, 6, 23, 0.7); border-radius: 8px; padding: 12px; font-size: 12px; border: 1px solid #1e293b; display: flex; flex-direction: column; gap: 6px; }
    .plan-green { border-color: rgba(16, 185, 129, 0.3); }
    .plan-yellow { border-color: rgba(245, 158, 11, 0.3); }
    .plan-red { border-color: rgba(239, 68, 68, 0.4); }

    /* Form Modal */
    .form-panel { display: none; background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 8px; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    .form-panel.show { display: grid; }
    .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 4px; padding: 6px 8px; color: #ffffff; font-size: 12px; }

    /* Snapshot */
    .snapshot-box { background: #020617; border: 1px solid #1e293b; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; color: #cbd5e1; word-break: break-all; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
