        revenueNote: "ETF 追蹤「特選臺灣TOP 50指數」(不適用公司月營收)",
        epsNote: "不配息設計（現金股利自動再投入淨值複利滾存）｜經理費 0.07%",

        newsItems: [
          { title: "009816 凱基台灣TOP50 主打不配息股利自動再投資 吸引長線複利買盤關注", pubDate: "近期焦點", link: "https://news.google.com/search?q=009816+凱基台灣TOP50&hl=zh-TW&gl=TW&ceid=TW:zh-Hant" }
        ]
      }
    ];

    // 正規化股票欄位 (若舊資料無 accountId，自動依代碼歸類或放入預設主力帳戶)
    const normalizeStockItem = (item, idx = 0) => {
      const cleanCode = String(item.code || "0000").trim().toUpperCase();
      const fixedName = BUILTIN_STOCK_DIR[cleanCode] && (!item.name || item.name.includes("自動抓取") || item.name.includes("台股精選") || item.name.includes("台股 "))
        ? BUILTIN_STOCK_DIR[cleanCode]
        : (item.name || BUILTIN_STOCK_DIR[cleanCode] || `台股(${cleanCode})`);
      const avgCost = Number(item.avgCost ?? item.cost ?? 100);
      const todayClose = Number(item.todayClose ?? item.closePrice ?? avgCost);
      const prevHigh = Math.max(Number(item.prevHigh ?? item.highPrice ?? avgCost), avgCost, todayClose);
      const ma20 = Number(item.ma20 ?? (todayClose * 0.975).toFixed(2));
      const defaultAcc = item.accountId || (cleanCode.startsWith("00") ? "acc_etf" : "acc_main");

      return {
        id: item.id || `${cleanCode}_${Date.now()}_${idx}`,
        accountId: defaultAcc,
        code: cleanCode,
        name: fixedName,
        lots: Number(item.lots ?? item.shares ?? 1),
        avgCost,
        prevHigh,
        todayClose,
        todayHigh: Number(item.todayHigh ?? todayClose),
        ma5: Number(item.ma5 ?? (todayClose * 0.99).toFixed(2)),
        ma10: Number(item.ma10 ?? (todayClose * 0.985).toFixed(2)),
        ma20,
        ma60: Number(item.ma60 ?? (ma20 * 0.97).toFixed(2)),
        mode: item.mode || (item.type === "短線" ? "short" : "swing"),
        stopLossPct: Number(item.stopLossPct) > 0 ? Number(item.stopLossPct) : (item.mode === "short" ? 5.0 : 8.0),
        stopMaType: item.stopMaType || "ma20",
        stopLogicMode: item.stopLogicMode || "or",
        maBreakBufferPct: item.maBreakBufferPct !== undefined ? Number(item.maBreakBufferPct) : 3.0,
        lastSyncedAt: item.lastSyncedAt || "已載入",
        syncSource: item.syncSource || "本地庫存記憶",
        twoDaysBelowMA: Boolean(item.twoDaysBelowMA),
        longBlackBreakMA5: Boolean(item.longBlackBreakMA5),
        maBullishAlign: item.maBullishAlign !== undefined ? Boolean(item.maBullishAlign) : true,
        priceVolGood: item.priceVolGood !== undefined ? Boolean(item.priceVolGood) : true,
        vetoMarginSpikeForeignSell: Boolean(item.vetoMarginSpikeForeignSell),
        vetoDayTraderLockLimitUp: Boolean(item.vetoDayTraderLockLimitUp),
        chipForeignTrustBuy: item.chipForeignTrustBuy !== undefined ? Boolean(item.chipForeignTrustBuy) : true,
        chipMarginDownShortUp: item.chipMarginDownShortUp !== undefined ? Boolean(item.chipMarginDownShortUp) : true,
        chipNoDayTrader: item.chipNoDayTrader !== undefined ? Boolean(item.chipNoDayTrader) : true,
        missingBranchData: false,
        fundRevGrowthTheme: item.fundRevGrowthTheme !== undefined ? Boolean(item.fundRevGrowthTheme) : true,
        sectorHotFocus: item.sectorHotFocus !== undefined ? Boolean(item.sectorHotFocus) : true,
        institutionalNote: item.institutionalNote || item.foreignBuy || "點擊「🔄 抓價」同步最新三大法人買賣超",
        marginNote: item.marginNote || item.marginChange || "點擊「🔄 抓價」同步最新融資融券變化",
        branchNote: item.branchNote || item.keyBroker || "🤖 點擊「🔄 抓價」由系統根據法人與量價推算主力動向",
        revenueNote: item.revenueNote || "點擊「🔄 抓價」自動抓取最新單月營收 YoY / MoM",
        epsNote: item.epsNote || "點擊「🔄 抓價」自動抓取最新財報 EPS 與本益比",
        fundamentalNote: item.fundamentalNote || item.newsNote || "請遵守設定之停損條件，拒絕基本面凹單。",

    function App() {
      // 1. 讀取自訂帳號清單
      const [accounts, setAccounts] = useState(() => {
        try {
          const savedAcc = localStorage.getItem(ACCOUNTS_STORAGE_KEY);
          if (savedAcc) {
            const parsed = JSON.parse(savedAcc);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return DEFAULT_ACCOUNTS;
      });

      // 目前選中的帳號分類 ('ALL' 代表全部總覽)
      const [activeAccountId, setActiveAccountId] = useState("ALL");
      const [isAccountManagerOpen, setIsAccountManagerOpen] = useState(false);
      const [newAccountName, setNewAccountName] = useState("");
      const [editingAccId, setEditingAccId] = useState(null);
      const [editingAccName, setEditingAccName] = useState("");

      // 2. 讀取股票庫存清單 (跨版本永久保留)
      const [stocks, setStocks] = useState(() => {
        try {
          const permSaved = localStorage.getItem(PRIMARY_STORAGE_KEY);
          if (permSaved) {
            const parsed = JSON.parse(permSaved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map((it, idx) => normalizeStockItem(it, idx));
            }
          }
          for (const oldKey of LEGACY_KEYS) {
            const oldSaved = localStorage.getItem(oldKey);
            if (oldSaved) {
              const parsed = JSON.parse(oldSaved);
              if (Array.isArray(parsed) && parsed.length > 0) {
                const migrated = parsed.map((it, idx) => normalizeStockItem(it, idx));
                localStorage.setItem(PRIMARY_STORAGE_KEY, JSON.stringify(migrated));
                return migrated;
              }
            }
          }
        } catch (e) {}
        return INITIAL_STOCKS;
      });

      const [selectedStockId, setSelectedStockId] = useState(() => stocks[0]?.id || "2330");
      const [colorStyle, setColorStyle] = useState("tw");
      const [activeTab, setActiveTab] = useState("dashboard");
      const [snapshotInput, setSnapshotInput] = useState("");
      const [syncBannerMsg, setSyncBannerMsg] = useState(null);
      const [copiedType, setCopiedType] = useState(null);

      // 視窗與抽屜控制
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isEditDrawerOpen, setIsEditDrawerOpen] = useState(false);
      const [isRuleExplainOpen, setIsRuleExplainOpen] = useState(false);
      const fileInputRef = useRef(null);

      const [newForm, setNewForm] = useState({
        accountId: "acc_main",
        code: "",
        name: "",
        lots: 1,
        avgCost: "",
        prevHigh: "",
        mode: "swing",
        stopLossPct: 10.0,
        stopMaType: "none",
        stopLogicMode: "or",
        maBreakBufferPct: 3.0
      });

      const [fetchingIds, setFetchingIds] = useState({});
      const [isSyncingAll, setIsSyncingAll] = useState(false);
      const [stockDict, setStockDict] = useState(BUILTIN_STOCK_DIR);

      // 自動保存庫存與帳號清單至 LocalStorage
      useEffect(() => {
        try {
          const jsonStr = JSON.stringify(stocks);
          localStorage.setItem(PRIMARY_STORAGE_KEY, jsonStr);
          localStorage.setItem("wallstreet_tw_stocks_v3", jsonStr);
        } catch (e) {}
      }, [stocks]);

      useEffect(() => {
        try {
          localStorage.setItem(ACCOUNTS_STORAGE_KEY, JSON.stringify(accounts));
        } catch (e) {}
      }, [accounts]);

      // 當切換頂部帳號標籤時，新增表單預設選中該帳號
      useEffect(() => {
        if (activeAccountId !== "ALL") {
          setNewForm(prev => ({ ...prev, accountId: activeAccountId }));
        }
      }, [activeAccountId]);

      // 啟動時擴充全市場台股與 ETF 名稱字典
      useEffect(() => {
        const loadAllTwStockNames = async () => {
          try {
            const res = await fetch("https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo");
            if (res.ok) {
              const json = await res.json();
              if (Array.isArray(json?.data) && json.data.length > 0) {
                const map = { ...BUILTIN_STOCK_DIR };
                json.data.forEach(item => {
                  if (item.stock_id && item.stock_name) {
                    map[item.stock_id] = item.stock_name;
                  }
                });
                map["009816"] = "凱基台灣TOP50";
                setStockDict(map);
              }
            }
          } catch (e) {}
        };
        loadAllTwStockNames();
      }, []);

      const todayDateStr = useMemo(() => {
        const d = new Date();
        return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
      }, []);

      // ============================================================================
      // 👥 簡易帳號新增 / 改名 / 刪除管理
      // ============================================================================
      const handleCreateAccount = (e) => {
        e.preventDefault();
        const trimmed = newAccountName.trim();
        if (!trimmed) return alert("請輸入新帳號或分類名稱！");
        const newId = "acc_" + Date.now();
        const nextAcc = [...accounts, { id: newId, name: trimmed }];
        setAccounts(nextAcc);
        setActiveAccountId(newId);
        setNewAccountName("");
        setSyncBannerMsg(`✅ 已建立新帳號分類：【${trimmed}】`);
      };

      const handleSaveAccountRename = (accId) => {
        const trimmed = editingAccName.trim();
        if (!trimmed) return;
        setAccounts(prev => prev.map(a => (a.id === accId ? { ...a, name: trimmed } : a)));
        setEditingAccId(null);
        setEditingAccName("");
      };

      const handleDeleteAccount = (accId, accName) => {
        if (accounts.length <= 1) {
          return alert("系統至少需保留一個預設帳號！");
        }
        const fallbackAcc = accounts.find(a => a.id !== accId) || accounts[0];
        const countInAcc = stocks.filter(s => s.accountId === accId).length;
        const msg = countInAcc > 0
          ? `確定要刪除帳號【${accName}】嗎？\n該帳號內的 ${countInAcc} 檔股票將自動移轉至【${fallbackAcc.name}】，不會被刪除。`
          : `確定要刪除帳號【${accName}】嗎？`;

        if (window.confirm(msg)) {
          setStocks(prev => prev.map(s => (s.accountId === accId ? { ...s, accountId: fallbackAcc.id } : s)));
          setAccounts(prev => prev.filter(a => a.id !== accId));
          if (activeAccountId === accId) setActiveAccountId("ALL");
          setSyncBannerMsg(`🗑️ 已刪除帳號分類【${accName}】`);
        }
      };

      const getAccountName = (accId) => {
        const found = accounts.find(a => a.id === accId);
        return found ? found.name : accounts[0]?.name || "預設帳戶";
      };

      // ============================================================================
      // 💾 備份匯出 (.json) 與 匯入還原功能 (包含所有帳號與庫存)
      // ============================================================================
      const handleExportBackupFile = () => {
        try {
          const backupPayload = {
            version: "3.2",
            exportedAt: new Date().toISOString(),
            accounts,
            stocks
          };
          const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const dateTag = todayDateStr.replace(/\//g, "");
          a.href = url;
          a.download = `台股多帳號風控庫存備份_${dateTag}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setSyncBannerMsg(`✅ 已成功匯出多帳號庫存備份檔 (台股多帳號風控庫存備份_${dateTag}.json)！`);
        } catch (err) {
          alert("匯出備份檔失敗：" + err.message);
        }
      };

      const handleImportBackupFile = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const content = String(e.target?.result || "").trim();
            if (content.startsWith("[狀態更新]")) {
              setSnapshotInput(content);
              setSyncBannerMsg("✅ 已讀取記憶碼文字，請點擊上方「📥 解析記憶碼並抓價」完成還原！");
              return;
            }
            const parsed = JSON.parse(content);
            if (Array.isArray(parsed?.accounts) && parsed.accounts.length > 0) {
              setAccounts(parsed.accounts);
            }
            const rawList = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.stocks) ? parsed.stocks : null);
            if (!rawList || rawList.length === 0) {
              alert("⚠️ 備份檔案格式不正確或無庫存資料！");
              return;
            }
            const restored = rawList.map((it, idx) => normalizeStockItem(it, idx));
            setStocks(restored);
            setSelectedStockId(restored[0].id);
            setActiveAccountId("ALL");
            setSyncBannerMsg(`✅ 成功從備份檔還原帳號分類與 ${restored.length} 檔庫存部位！`);
          } catch (err) {
            alert("⚠️ 讀取備份檔失敗，請確認檔案為本系統匯出之 .json 檔案！");
          } finally {
            event.target.value = "";
          }
        };
        reader.readAsText(file);
      };

      // ============================================================================
      // 🌐 全方位自動抓取引擎
      // ============================================================================
      const fetchSingleStockMarketData = async (stockItem) => {
        const cleanCode = String(stockItem.code).trim().toUpperCase();
        const isETF = cleanCode.startsWith("00");
        const nowTimeStr = new Date().toLocaleTimeString("zh-TW", { hour12: false });

        let fetchedName = BUILTIN_STOCK_DIR[cleanCode] || stockDict[cleanCode] || "";
        if (!fetchedName && stockItem.name && !stockItem.name.includes("自動抓取") && !stockItem.name.includes("抓取中") && !stockItem.name.includes("台股精選")) {
          fetchedName = stockItem.name;
        }

        let priceResult = null;
        let instNote = stockItem.institutionalNote;
        let margNote = stockItem.marginNote;
        let autoBranchNote = stockItem.branchNote;
        let revenueNote = stockItem.revenueNote;
        let epsNote = stockItem.epsNote;
        let newsList = Array.isArray(stockItem.newsItems) ? stockItem.newsItems : [];

        let chipForeignTrustBuy = stockItem.chipForeignTrustBuy;
        let chipMarginDownShortUp = stockItem.chipMarginDownShortUp;
        let chipNoDayTrader = stockItem.chipNoDayTrader;
        let vetoMarginSpikeForeignSell = false;
        let fundRevGrowthTheme = stockItem.fundRevGrowthTheme;
        let sourceLabel = "";

        const startD130 = new Date(Date.now() - 135 * 86400000).toISOString().slice(0, 10);
        const startDShort = new Date(Date.now() - 20 * 86400000).toISOString().slice(0, 10);
        const startDYear = new Date(Date.now() - 420 * 86400000).toISOString().slice(0, 10);

        if (!fetchedName) {
          try {
            const infoRes = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo&data_id=${encodeURIComponent(cleanCode)}`);
            if (infoRes.ok) {
              const infoJson = await infoRes.json();
              if (Array.isArray(infoJson?.data) && infoJson.data.length > 0) {
                fetchedName = infoJson.data[0].stock_name || fetchedName;
              }
            }
          } catch (e) {}
        }

        let latestVolumeRatio = 1.0;
        let hasUpperShadow = false;
        try {
          const fmUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${encodeURIComponent(cleanCode)}&start_date=${startD130}`;
          const fmRes = await fetch(fmUrl);
          if (fmRes.ok) {
            const fmJson = await fmRes.json();
            if (Array.isArray(fmJson?.data) && fmJson.data.length > 0) {
              const rows = fmJson.data.filter(r => Number(r.close) > 0);
              if (rows.length > 0) {
                const latest = rows[rows.length - 1];
                const prevRow = rows.length >= 2 ? rows[rows.length - 2] : latest;
                const calcMA = (n) => {
                  const slice = rows.slice(-n);
                  const sum = slice.reduce((acc, cur) => acc + Number(cur.close), 0);
                  return Number((sum / slice.length).toFixed(2));
                };
                const ma5 = calcMA(5);
                const ma10 = calcMA(10);
                const ma20 = calcMA(20);
                const ma60 = calcMA(60);
                const todayClose = Number(latest.close);
                const todayHigh = Number(latest.max || latest.close);
                const todayOpen = Number(latest.open || latest.close);

                const activeMaType = stockItem.stopMaType || "ma20";
                const baseMA = activeMaType === "ma10" ? ma10 : activeMaType === "ma60" ? ma60 : ma20;

                const twoDaysBelowMA = activeMaType !== "none" && rows.length >= 2 && Number(latest.close) < baseMA && Number(prevRow.close) < baseMA;
                const avgVol5 = rows.slice(-5).reduce((a, c) => a + Number(c.Trading_Volume || 0), 0) / Math.min(5, rows.length);
                latestVolumeRatio = avgVol5 > 0 ? Number(latest.Trading_Volume || 0) / avgVol5 : 1.0;
                const isHeavyVol = latestVolumeRatio > 1.45;
                const isLongBlack = todayClose < todayOpen * 0.975;
                hasUpperShadow = (todayHigh - Math.max(todayClose, todayOpen)) / todayClose > 0.02;

                priceResult = {
                  todayClose,
                  todayHigh,
                  ma5,
                  ma10,
                  ma20,
                  ma60,
                  dataDate: latest.date,
                  twoDaysBelowMA,
                  longBlackBreakMA5: isLongBlack && isHeavyVol && todayClose < ma5,
                  maBullishAlign: todayClose >= ma5 && ma5 >= ma10 && ma10 >= ma20,
                  priceVolGood: todayClose >= Number(prevRow.close)
                };
                sourceLabel = `FinMind 歷史K線 (${latest.date})`;
              }
            }
          }
        } catch (e) {}

        if (!priceResult) {
          const suffixes = [".TW", ".TWO"];
          for (const sfx of suffixes) {
            if (priceResult) break;
            try {
              const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${cleanCode}${sfx}?range=6mo&interval=1d`;
              const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
              const yRes = await fetch(proxyUrl);
              if (yRes.ok) {
                const yOuter = await yRes.json();
                const yData = JSON.parse(yOuter.contents);
                const result = yData?.chart?.result?.[0];
                if (result) {
                  const meta = result.meta || {};
                  if (!fetchedName && (meta.shortName || meta.longName)) {
                    fetchedName = BUILTIN_STOCK_DIR[cleanCode] || meta.shortName || meta.longName;
                  }
                  const quotes = result.indicators?.quote?.[0] || {};
                  const closes = (quotes.close || []).map((c, idx) => ({
                    close: c,
                    high: quotes.high?.[idx] || c,
                    open: quotes.open?.[idx] || c,
                    vol: quotes.volume?.[idx] || 0
                  })).filter(r => r.close != null && Number(r.close) > 0);

                  if (closes.length > 0) {
                    const latest = closes[closes.length - 1];
                    const prevRow = closes.length >= 2 ? closes[closes.length - 2] : latest;
                    const calcMA = (n) => {
                      const sl = closes.slice(-n);
                      return Number((sl.reduce((a, b) => a + Number(b.close), 0) / sl.length).toFixed(2));
                    };
                    const ma5 = calcMA(5);
                    const ma10 = calcMA(10);
                    const ma20 = calcMA(20);
                    const ma60 = calcMA(60);
                    const todayClose = Number(Number(latest.close).toFixed(2));
                    const todayHigh = Number(Number(latest.high || latest.close).toFixed(2));

                    const activeMaType = stockItem.stopMaType || "ma20";
                    const baseMA = activeMaType === "ma10" ? ma10 : activeMaType === "ma60" ? ma60 : ma20;

                    priceResult = {
                      todayClose,
                      todayHigh,
                      ma5,
                      ma10,
                      ma20,
                      ma60,
                      dataDate: "最新交易日",
                      twoDaysBelowMA: activeMaType !== "none" && closes.length >= 2 && todayClose < baseMA && Number(prevRow.close) < baseMA,
                      longBlackBreakMA5: todayClose < Number(latest.open) * 0.975 && todayClose < ma5,
                      maBullishAlign: todayClose >= ma5 && ma5 >= ma10 && ma10 >= ma20,
                      priceVolGood: todayClose >= Number(prevRow.close)
                    };
                    sourceLabel = `Yahoo Finance K線 (${cleanCode}${sfx})`;
                  }
                }
              }
            } catch (e) {}
          }
        }

        let fNet = 0, tNet = 0, dNet = 0, mDiff = 0, sDiff = 0;
        let hasInstData = false;

        try {
          const instUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=${encodeURIComponent(cleanCode)}&start_date=${startDShort}`;
          const instRes = await fetch(instUrl);
          if (instRes.ok) {
            const instJson = await instRes.json();
            if (Array.isArray(instJson?.data) && instJson.data.length > 0) {
              hasInstData = true;
              const dates = [...new Set(instJson.data.map(d => d.date))].sort();
              const latestDate = dates[dates.length - 1];
              const dayRows = instJson.data.filter(d => d.date === latestDate);

              dayRows.forEach(r => {
                const diffLots = Math.round((Number(r.buy || 0) - Number(r.sell || 0)) / 1000);
                if (String(r.name).includes("Foreign")) fNet += diffLots;
                else if (String(r.name).includes("Investment_Trust")) tNet += diffLots;
                else if (String(r.name).includes("Dealer")) dNet += diffLots;
              });

              const fmt = (n) => (n >= 0 ? `+${n.toLocaleString()}張` : `${n.toLocaleString()}張`);
              instNote = `外資 ${fmt(fNet)} / 投信 ${fmt(tNet)} / 自營商 ${fmt(dNet)} (資料日:${latestDate})`;
              chipForeignTrustBuy = (fNet > 0 && tNet >= 0) || (tNet > 0 && fNet >= 0) || (fNet + tNet > 80);
            }
          }
        } catch (e) {}

        try {
          const margUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMarginPurchaseShortSale&data_id=${encodeURIComponent(cleanCode)}&start_date=${startDShort}`;
          const margRes = await fetch(margUrl);
          if (margRes.ok) {
            const margJson = await margRes.json();
            if (Array.isArray(margJson?.data) && margJson.data.length > 0) {
              const latestM = margJson.data[margJson.data.length - 1];
              mDiff = Math.round((Number(latestM.MarginPurchaseBuy || 0) - Number(latestM.MarginPurchaseSell || 0) - Number(latestM.MarginPurchaseCashRepayment || 0)));
              sDiff = Math.round((Number(latestM.ShortSaleSell || 0) - Number(latestM.ShortSaleBuy || 0) - Number(latestM.ShortSaleCashRepayment || 0)));
              const fmt = (n) => (n >= 0 ? `+${n.toLocaleString()}張` : `${n.toLocaleString()}張`);
              margNote = `融資變化 ${fmt(mDiff)} / 融券變化 ${fmt(sDiff)} (${latestM.date})，${mDiff <= 0 ? "散戶浮額減少、籌碼沉澱" : "融資增加、留意散戶追高"}。`;
              chipMarginDownShortUp = mDiff <= 0;
            }
          }
        } catch (e) {}

        if (mDiff > 500 && fNet < -300 && tNet <= 0) {
          vetoMarginSpikeForeignSell = true;
        }

        const isUserCustomBranch = stockItem.branchNote && !stockItem.branchNote.startsWith("🤖");
        if (!isUserCustomBranch) {
          if (isETF) {
            autoBranchNote = `🤖 系統籌碼推算：此標的為 ETF (${cleanCode} ${fetchedName || ""})，主要由外資與自營商造市商進行流動性調節，走勢緊貼成分股淨值，無單一隔日沖主力亂場問題。`;
            chipNoDayTrader = true;
          } else if (hasInstData) {
            const totalInst = fNet + tNet + dNet;
            if (fNet > 200 && tNet > 50) {
              autoBranchNote = `🤖 系統籌碼推算：外資(+${fNet}張)與投信(+${tNet}張)土洋合買鎖碼，主力大戶籌碼集中度極高。`;
              chipNoDayTrader = true;
            } else if (totalInst < -500 && mDiff > 300) {
              autoBranchNote = `🤖 系統籌碼推算：三大法人合計賣超 ${totalInst} 張，但散戶融資逆勢增加 +${mDiff} 張，呈現「主力倒貨、散戶接刀」之籌碼發散訊號！`;
              chipNoDayTrader = false;
            } else if (latestVolumeRatio > 1.8 && hasUpperShadow) {
              autoBranchNote = `🤖 系統籌碼推算：今日成交量放大至五日均量 ${latestVolumeRatio.toFixed(1)} 倍且留上影線，顯示短線/隔日沖大戶逢高調節，明日早盤留意賣壓。`;
              chipNoDayTrader = false;
            } else if (totalInst >= 0) {
              autoBranchNote = `🤖 系統籌碼推算：法人合計買超 +${totalInst} 張，量能溫和穩定，未見異常隔日沖大舉出貨跡象。`;
              chipNoDayTrader = true;
            } else {
              autoBranchNote = `🤖 系統籌碼推算：法人小幅調節 ${totalInst} 張，籌碼中性整理。`;
              chipNoDayTrader = true;
            }
          } else {
            autoBranchNote = `🤖 系統籌碼推算：量價結構平穩，無異常爆量出貨訊號。`;
          }
        }

        if (isETF) {
          const etfInfo = ETF_FUNDAMENTAL_DB[cleanCode] || {
            revText: `ETF 基金標的 (${cleanCode})，追蹤標的指數表現，不適用一般公司月營收。`,
            epsText: "配息與淨值增長依成分股權重與基金公開說明書規範。",
            peText: "緊貼台股權值或產業成分股基本面趨勢。"
          };
          revenueNote = etfInfo.revText;
          epsNote = `${etfInfo.epsText}｜${etfInfo.peText}`;
          fundRevGrowthTheme = true;
        } else {
          try {
            const revUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMonthRevenue&data_id=${encodeURIComponent(cleanCode)}&start_date=${startDYear}`;
            const revRes = await fetch(revUrl);
            if (revRes.ok) {
              const revJson = await revRes.json();
              if (Array.isArray(revJson?.data) && revJson.data.length > 0) {
                const rows = revJson.data;
                const latestR = rows[rows.length - 1];
                const prevMonthR = rows.length >= 2 ? rows[rows.length - 2] : null;
                const prevYearR = rows.find(
                  r => Number(r.revenue_year) === Number(latestR.revenue_year) - 1 && Number(r.revenue_month) === Number(latestR.revenue_month)
                );

                const revBillion = (Number(latestR.revenue) / 100000000).toFixed(2);
                const mom = prevMonthR && Number(prevMonthR.revenue) > 0
                  ? (((Number(latestR.revenue) - Number(prevMonthR.revenue)) / Number(prevMonthR.revenue)) * 100).toFixed(1)
                  : null;
                const yoy = prevYearR && Number(prevYearR.revenue) > 0
                  ? (((Number(latestR.revenue) - Number(prevYearR.revenue)) / Number(prevYearR.revenue)) * 100).toFixed(1)
                  : null;

                const momStr = mom !== null ? `月增(MoM) ${Number(mom) >= 0 ? "+" : ""}${mom}%` : "";
                const yoyStr = yoy !== null ? `年增(YoY) ${Number(yoy) >= 0 ? "+" : ""}${yoy}%` : "";
                revenueNote = `${latestR.revenue_year}年${latestR.revenue_month}月營收 ${revBillion} 億元｜${[yoyStr, momStr].filter(Boolean).join("、")}`;
                if (yoy !== null) {
                  fundRevGrowthTheme = Number(yoy) > 0 || Number(mom) > 0;
                }
              }
            }
          } catch (e) {}

          let latestEpsStr = "";
          let latestPeStr = "";
          try {
            const fsUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockFinancialStatements&data_id=${encodeURIComponent(cleanCode)}&start_date=${startDYear}`;
            const fsRes = await fetch(fsUrl);
            if (fsRes.ok) {
              const fsJson = await fsRes.json();
              if (Array.isArray(fsJson?.data) && fsJson.data.length > 0) {
                const epsRows = fsJson.data.filter(r => r.type === "EPS");
                if (epsRows.length > 0) {
                  const lastEps = epsRows[epsRows.length - 1];
                  latestEpsStr = `最新單季(${lastEps.date}) EPS ${Number(lastEps.value).toFixed(2)} 元`;
                }
              }
            }
          } catch (e) {}

          try {
            const perUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPER&data_id=${encodeURIComponent(cleanCode)}&start_date=${startDShort}`;
            const perRes = await fetch(perUrl);
            if (perRes.ok) {
              const perJson = await perRes.json();
              if (Array.isArray(perJson?.data) && perJson.data.length > 0) {
                const lastPer = perJson.data[perJson.data.length - 1];
                latestPeStr = `本益比(PE) ${lastPer.PER || "-"} 倍｜股價淨值比(PBR) ${lastPer.PBR || "-"}｜殖利率 ${lastPer.dividend_yield || "-"}%`;
              }
            }
          } catch (e) {}

          if (latestEpsStr || latestPeStr) {
            epsNote = [latestEpsStr, latestPeStr].filter(Boolean).join(" ｜ ");
          }
        }

        const queryStockName = fetchedName || BUILTIN_STOCK_DIR[cleanCode] || cleanCode;
        try {
          const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(cleanCode + " " + queryStockName)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
          const newsApiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
          const newsRes = await fetch(newsApiUrl);
          if (newsRes.ok) {
            const newsJson = await newsRes.json();
            if (Array.isArray(newsJson?.items) && newsJson.items.length > 0) {
              newsList = newsJson.items.slice(0, 3).map(item => ({
                title: item.title,
                pubDate: item.pubDate ? item.pubDate.slice(0, 10) : "最新消息",
                link: item.link
              }));
            }
          }
        } catch (e) {}

        if (!newsList || newsList.length === 0) {
          newsList = [
            {
              title: `點擊查看 Google 新聞【${cleanCode} ${queryStockName}】最新營收、法說會與法人報告`,
              pubDate: "即時檢索",
              link: `https://news.google.com/search?q=${encodeURIComponent(cleanCode + " " + queryStockName)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`
            }
          ];
        }

        const fallbackPrice = cleanCode === "009816" ? 13.88 : Number(stockItem.todayClose || stockItem.avgCost || 100);
        const finalClose = priceResult?.todayClose ?? fallbackPrice;
        const finalHigh = priceResult?.todayHigh ?? Math.max(Number(stockItem.todayHigh || 0), finalClose);
        const finalPrevHigh = Math.max(Number(stockItem.prevHigh || 0), Number(stockItem.avgCost || 0), finalClose, finalHigh);
        const finalName = BUILTIN_STOCK_DIR[cleanCode] || fetchedName || `台股(${cleanCode})`;

        return {
          ...stockItem,
          code: cleanCode,
          name: finalName,
          prevHigh: finalPrevHigh,
          todayClose: finalClose,
          todayHigh: finalHigh,
          ma5: priceResult?.ma5 ?? Number((finalClose * 0.99).toFixed(2)),
          ma10: priceResult?.ma10 ?? Number((finalClose * 0.985).toFixed(2)),
          ma20: priceResult?.ma20 ?? Number((finalClose * 0.975).toFixed(2)),
          ma60: priceResult?.ma60 ?? Number((finalClose * 0.95).toFixed(2)),
          twoDaysBelowMA: priceResult ? priceResult.twoDaysBelowMA : stockItem.twoDaysBelowMA,
          longBlackBreakMA5: priceResult ? priceResult.longBlackBreakMA5 : stockItem.longBlackBreakMA5,
          maBullishAlign: priceResult ? priceResult.maBullishAlign : stockItem.maBullishAlign,
          priceVolGood: priceResult ? priceResult.priceVolGood : stockItem.priceVolGood,
          chipForeignTrustBuy,
          chipMarginDownShortUp,
          chipNoDayTrader,
          vetoMarginSpikeForeignSell,
          missingBranchData: false,
          fundRevGrowthTheme,
          institutionalNote: instNote || "外資與投信盤後籌碼已同步檢索完成。",
          marginNote: margNote || "資券結構穩定，無異常暴增訊號。",
          branchNote: isUserCustomBranch ? stockItem.branchNote : autoBranchNote,
          revenueNote: revenueNote || "尚無當月營收更新資料",
          epsNote: epsNote || "尚無最新單季財報 EPS 資料",
          newsItems: newsList,
          fundamentalNote: isETF
            ? (ETF_FUNDAMENTAL_DB[cleanCode]?.peText || `已完成 ${cleanCode} ${finalName} 淨值與均線位階同步。`)
            : `已同步 ${cleanCode} ${finalName} 最新收盤 ${finalClose} 元與月營收/財報表現，請嚴格遵守設定之停損條件，拒絕基本面凹單。`,
          lastSyncedAt: `${nowTimeStr} 同步完成`,
          syncSource: sourceLabel || "TWSE/FinMind 綜合資料庫"
        };
      };

      const handleSyncSingleStock = async (stockItem, e) => {
        if (e) e.stopPropagation();
        setFetchingIds(prev => ({ ...prev, [stockItem.id]: true }));
        setSyncBannerMsg(`⏳ 正在聯網抓取【${stockItem.code} ${stockItem.name || ""}】最新收盤價、均線、月營收、EPS 與新聞...`);

        const updated = await fetchSingleStockMarketData(stockItem);
        setStocks(prev => prev.map(s => (s.id === stockItem.id ? updated : s)));
        setFetchingIds(prev => ({ ...prev, [stockItem.id]: false }));
        setSyncBannerMsg(`✅ 【${updated.code} ${updated.name}】更新完成！最新收盤：${updated.todayClose} 元`);
      };

      const handleSyncAllStocks = async () => {
        const targetList = activeAccountId === "ALL" ? stocks : stocks.filter(s => s.accountId === activeAccountId);
        if (isSyncingAll || targetList.length === 0) return;
        setIsSyncingAll(true);
        setSyncBannerMsg(`⏳ 正在批量抓取目前檢視之 (${targetList.length} 檔) 最新 K 線均線、法人籌碼、月營收、EPS 與新聞...`);

        const updatedMap = {};
        for (const item of targetList) {
          setFetchingIds(prev => ({ ...prev, [item.id]: true }));
          const updated = await fetchSingleStockMarketData(item);
          updatedMap[item.id] = updated;
          setFetchingIds(prev => ({ ...prev, [item.id]: false }));
        }
        setStocks(prev => prev.map(s => updatedMap[s.id] || s));
        setIsSyncingAll(false);
        setSyncBannerMsg(`✅ (${targetList.length} 檔) 股價、均線、月營收、EPS 與新聞已全數同步完畢！`);
      };

      const handleAddStockSubmit = async (e) => {
        e.preventDefault();
        const cleanCode = String(newForm.code).trim().toUpperCase();
        const avgCostNum = Number(newForm.avgCost);
        const lotsNum = Number(newForm.lots) || 1;
        if (!cleanCode || !avgCostNum || avgCostNum <= 0) {
          alert("請輸入有效的「股票代號」與「平均成本」！");
          return;
        }

        const matchedName = BUILTIN_STOCK_DIR[cleanCode] || stockDict[cleanCode] || newForm.name.trim() || "";
        const initHigh = Number(newForm.prevHigh) > 0 ? Number(newForm.prevHigh) : avgCostNum;
        const newId = `${cleanCode}_${Date.now()}`;
        const targetAccId = newForm.accountId || (activeAccountId !== "ALL" ? activeAccountId : accounts[0]?.id);

        const draftStock = normalizeStockItem({
          id: newId,
          accountId: targetAccId,
          code: cleanCode,
          name: matchedName || `連線抓取中(${cleanCode})`,
          lots: lotsNum,
          avgCost: avgCostNum,
          prevHigh: Math.max(initHigh, avgCostNum),
          todayClose: avgCostNum,
          todayHigh: avgCostNum,
          mode: newForm.mode || "swing",
          stopLossPct: Number(newForm.stopLossPct) || 10.0,
          stopMaType: newForm.stopMaType || "none",
          stopLogicMode: newForm.stopLogicMode || "or",
          maBreakBufferPct: Number(newForm.maBreakBufferPct) >= 0 ? Number(newForm.maBreakBufferPct) : 3.0,
          lastSyncedAt: "連線抓取中..."
        });

        setStocks(prev => [...prev, draftStock]);
        setSelectedStockId(newId);
        setIsAddModalOpen(false);
        setNewForm(prev => ({
          ...prev, code: "", name: "", lots: 1, avgCost: "", prevHigh: ""
        }));

        setFetchingIds(prev => ({ ...prev, [newId]: true }));
        setSyncBannerMsg(`⏳ 已新增【${cleanCode} ${matchedName}】至「${getAccountName(targetAccId)}」，正在自動抓取收盤價、均線、月營收、EPS 與新聞...`);
        const syncedStock = await fetchSingleStockMarketData(draftStock);
        setStocks(prev => prev.map(s => (s.id === newId ? syncedStock : s)));
        setFetchingIds(prev => ({ ...prev, [newId]: false }));
        setSyncBannerMsg(`✅ 【${syncedStock.code} ${syncedStock.name}】自動抓取完成！最新收盤：${syncedStock.todayClose} 元`);
      };

      const handleDeleteStock = (id, code, name, e) => {
        if (e) e.stopPropagation();
        if (window.confirm(`確定要從庫存風控儀表板中刪除【${code} ${name}】嗎？`)) {
          setStocks(prev => {
            const next = prev.filter(s => s.id !== id);
            if (selectedStockId === id && next.length > 0) {
              setSelectedStockId(next[0].id);
            }
            return next;
          });
          setSyncBannerMsg(`🗑️ 已刪除庫存【${code} ${name}】`);
        }
      };

      // ============================================================================
      // 🧮 風控與紀律演算法
      // ============================================================================
      const evaluatedStocks = useMemo(() => {
        return stocks.map(s => {
          const avgCost = Number(s.avgCost) || 0;
          const todayClose = Number(s.todayClose) || 0;
          const todayHigh = Number(s.todayHigh) || todayClose;
          const prevHigh = Number(s.prevHigh) || avgCost;
          const ma5 = Number(s.ma5) || 0;
          const ma10 = Number(s.ma10) || 0;
          const ma20 = Number(s.ma20) || 0;
          const ma60 = Number(s.ma60) || Number((ma20 * 0.97).toFixed(2));
          const lots = Number(s.lots || 0);

          const updatedHigh = Math.max(prevHigh, todayHigh, todayClose);
          const pnlPct = avgCost > 0 ? ((todayClose - avgCost) / avgCost) * 100 : 0;
          const peakGainPct = avgCost > 0 ? ((updatedHigh - avgCost) / avgCost) * 100 : 0;
          const drawdownFromPeakPct = updatedHigh > 0 ? ((updatedHigh - todayClose) / updatedHigh) * 100 : 0;
          const totalCostAmt = Math.round(avgCost * lots * 1000);
          const marketValueAmt = Math.round(todayClose * lots * 1000);
          const unrealizedPnL = marketValueAmt - totalCostAmt;

          const customLossPct = Number(s.stopLossPct) > 0 ? Number(s.stopLossPct) : 8.0;
          const hardStopLossLimitPct = -Math.abs(customLossPct);
          const costStopFactor = 1 - Math.abs(customLossPct) / 100;
          const hardStopPriceByCost = avgCost * costStopFactor;

          const stopMaType = s.stopMaType || "ma20";
          const stopLogicMode = s.stopLogicMode || "or";
          const maBufferPct = s.maBreakBufferPct !== undefined ? Number(s.maBreakBufferPct) : 3.0;
          const maBufferFactor = 1 - Math.max(0, maBufferPct) / 100;

          let baseMA = 0;
          let baseMALabel = "純看%數(不看均線)";
          if (stopMaType === "ma10") {
            baseMA = ma10;
            baseMALabel = "10MA(十日線)";
          } else if (stopMaType === "ma20") {
            baseMA = ma20;
            baseMALabel = "20MA(月線)";
          } else if (stopMaType === "ma60") {
            baseMA = ma60;
            baseMALabel = "60MA(季線)";
          }

          const techBreakTriggerPrice = baseMA > 0 ? baseMA * maBufferFactor : 0;

          const isFundStopTriggered = pnlPct <= hardStopLossLimitPct;
          const isTechStopTriggered = stopMaType !== "none" && baseMA > 0 && (
            todayClose <= techBreakTriggerPrice || Boolean(s.twoDaysBelowMA)
          );

          let isHardStopTriggered = false;
          let defaultHardStopPrice = hardStopPriceByCost;

          if (stopMaType === "none") {
            isHardStopTriggered = isFundStopTriggered;
            defaultHardStopPrice = hardStopPriceByCost;
          } else if (stopLogicMode === "and") {
            isHardStopTriggered = isFundStopTriggered && isTechStopTriggered;
            defaultHardStopPrice = Math.min(hardStopPriceByCost, techBreakTriggerPrice);
          } else {
            isHardStopTriggered = isFundStopTriggered || isTechStopTriggered;
            defaultHardStopPrice = Math.max(hardStopPriceByCost, techBreakTriggerPrice);
          }

          const isTrailingActive = peakGainPct >= 15.0;
          const trailingStopPrice = updatedHigh * 0.95;
          const isTrailingTriggered = isTrailingActive && (todayClose <= trailingStopPrice || Boolean(s.longBlackBreakMA5));

          const isBreakevenActive = !isTrailingActive && peakGainPct >= 8.0;
          const breakevenPrice = avgCost * 1.01;
          const isBreakevenTriggered = isBreakevenActive && todayClose <= breakevenPrice;

          const isChipVetoTriggered = Boolean(s.vetoMarginSpikeForeignSell) || Boolean(s.vetoDayTraderLockLimitUp);

          let defenseLinePrice = defaultHardStopPrice;
          let defenseLineLabel = stopMaType === "none"
            ? `買價 -${customLossPct}% (${hardStopPriceByCost.toFixed(2)}元)`
            : stopLogicMode === "and"
            ? `雙重條件：-${customLossPct}% (${hardStopPriceByCost.toFixed(2)}) 且破${baseMALabel} (${techBreakTriggerPrice.toFixed(2)})`
            : `Max(-${customLossPct}%:${hardStopPriceByCost.toFixed(2)}, 破${baseMALabel}${maBufferPct > 0 ? `-${maBufferPct}%` : ""}:${techBreakTriggerPrice.toFixed(2)})`;

          if (isTrailingActive) {
            defenseLinePrice = Math.max(trailingStopPrice, ma5);
            defenseLineLabel = `移動停利價 (高點回落5%: ${trailingStopPrice.toFixed(2)} / 5MA: ${ma5.toFixed(2)})`;
          } else if (isBreakevenActive) {
            defenseLinePrice = stopMaType === "none" ? breakevenPrice : Math.max(breakevenPrice, techBreakTriggerPrice);
            defenseLineLabel = `保本防守線 (成本+1%: ${breakevenPrice.toFixed(2)}元)`;
          }

          let actionCommand = "【🟢 續抱】";
          let actionSubTag = `未達停損點 (${defenseLinePrice.toFixed(2)}元)`;
          let actionBadgeType = "hold";
          let actionReason = "未觸發停損或移動停利條件，守穩防守底線續抱。";

          if (isHardStopTriggered) {
            actionCommand = "【🚨 觸價停損】";
            actionBadgeType = "stop_loss";
            const reasons = [];
            const shortTags = [];
            if (isFundStopTriggered) {
              reasons.push(`帳面虧損 ${pnlPct.toFixed(2)}% 已達設定之 -${customLossPct}% 停損線 (${hardStopPriceByCost.toFixed(2)}元)`);
              shortTags.push(`虧損達 -${customLossPct}%`);
            }
            if (isTechStopTriggered) {
              if (todayClose <= techBreakTriggerPrice) {
                reasons.push(`收盤價 (${todayClose.toFixed(2)}) 跌破 ${baseMALabel} 觸發價 (${techBreakTriggerPrice.toFixed(2)}元)`);
                shortTags.push(`跌破 ${baseMALabel}`);
              } else if (s.twoDaysBelowMA) {
                reasons.push(`連續兩日收盤站不回 ${baseMALabel} (${baseMA.toFixed(2)}元)`);
                shortTags.push(`連2日破 ${baseMALabel}`);
              }
            }
            actionSubTag = `原因：${shortTags.join(" + ")}${!isFundStopTriggered && isTechStopTriggered ? ` (若只想看-${customLossPct}%請改選「純看%數」)` : ""}`;
            actionReason = `強制砍單：${reasons.join(" ＋ ")}。${!isFundStopTriggered && isTechStopTriggered ? `💡 提醒：您的虧損 (${pnlPct.toFixed(2)}%) 尚未達 -${customLossPct}%，本次是因為「跌破 ${baseMALabel}」而觸發技術面停損！若您只想以買入價 -${customLossPct}% 為唯一標準，請將停損規則改為「純看%數(不看均線)」。` : "觸及資金停損底線，拒絕凹單！"}`;
          } else if (isTrailingTriggered) {
            actionCommand = "【💰 減碼停利】";
            actionBadgeType = "take_profit";
            actionSubTag = `最高價回落 ${drawdownFromPeakPct.toFixed(1)}%`;
            actionReason = `移動停利觸發：自期間最高價 ${updatedHigh.toFixed(2)} 回落達 ${drawdownFromPeakPct.toFixed(2)}% (>=5%)，強制鎖住波段獲利！`;
          } else if (isBreakevenTriggered) {
            actionCommand = "【💰 保本停利】";
            actionBadgeType = "take_profit";
            actionSubTag = `跌破成本+1%保本線 (${breakevenPrice.toFixed(2)}元)`;
            actionReason = `曾獲利達 +${peakGainPct.toFixed(2)}% (超過+8%啟動保本保護)，現跌破成本+1%保本線 (${breakevenPrice.toFixed(2)}元)，嚴禁由盈轉虧！`;
          } else if (isChipVetoTriggered) {
            actionCommand = "【⚠️ 逢高減碼/避險】";
            actionBadgeType = "chip_veto";
            actionSubTag = "原因：籌碼敗壞一票否決";
            actionReason = `籌碼敗壞一票否決：出現融資暴增+法人大賣或隔日沖鎖漲停，隔日早盤強制逢高減碼避險！`;
          }

          let chipScore = 0;
          if (s.chipForeignTrustBuy) chipScore += 2.0;
          if (s.chipMarginDownShortUp) chipScore += 1.0;
          if (s.chipNoDayTrader) chipScore += 1.0;
          if (s.vetoMarginSpikeForeignSell) chipScore = Math.max(0, chipScore - 2.0);
          if (s.vetoDayTraderLockLimitUp) chipScore = Math.max(0, chipScore - 1.0);

          let techScore = 0;
          const refMA = baseMA > 0 ? baseMA : ma20;
          if (s.maBullishAlign && todayClose >= refMA) techScore += 1.5;
          if (s.priceVolGood) techScore += 1.5;
          if (isTechStopTriggered) techScore = 0;
          else if (todayClose < refMA) techScore = Math.max(0, techScore - 1.5);

          const fundScore = s.fundRevGrowthTheme ? 2.0 : 0.5;
          const sectorScore = s.sectorHotFocus ? 1.0 : 0.0;
          const totalScore = Number((chipScore + techScore + fundScore + sectorScore).toFixed(1));

          return {
            ...s,
            ma60,
            customLossPct,
            stopMaType,
            stopLogicMode,
            maBufferPct,
            hardStopPriceByCost,
            updatedHigh,
            pnlPct,
            peakGainPct,
            drawdownFromPeakPct,
            totalCostAmt,
            marketValueAmt,
            unrealizedPnL,
            baseMA,
            baseMALabel,
            techBreakTriggerPrice,
            defaultHardStopPrice,
            trailingStopPrice,
            breakevenPrice,
            defenseLinePrice,
            defenseLineLabel,
            isTrailingActive,
            isBreakevenActive,
            isFundStopTriggered,
            isTechStopTriggered,
            isHardStopTriggered,
            isTrailingTriggered,
            isBreakevenTriggered,
            isChipVetoTriggered,
            actionCommand,
            actionSubTag,
            actionBadgeType,
            actionReason,
            chipScore,
            techScore,
            fundScore,
            sectorScore,
            totalScore
          };
        });
      }, [stocks]);

      // 依目前選中之簡易帳號過濾顯示的股票
      const filteredStocks = useMemo(() => {
        if (activeAccountId === "ALL") return evaluatedStocks;
        return evaluatedStocks.filter(s => s.accountId === activeAccountId);
      }, [evaluatedStocks, activeAccountId]);

      // 計算目前選中帳號 (或全部帳號) 的總資產與損益摘要
      const accountSummary = useMemo(() => {
        const totalCost = filteredStocks.reduce((acc, s) => acc + s.totalCostAmt, 0);
        const totalMarketVal = filteredStocks.reduce((acc, s) => acc + s.marketValueAmt, 0);
        const totalPnL = totalMarketVal - totalCost;
        const totalPnLPct = totalCost > 0 ? (totalPnL / totalCost) * 100 : 0;
        const stopLossCount = filteredStocks.filter(s => s.actionBadgeType === "stop_loss").length;
        return {
          count: filteredStocks.length,
          totalCost,
          totalMarketVal,
          totalPnL,
          totalPnLPct,
          stopLossCount
        };
      }, [filteredStocks]);

      const selectedStock = useMemo(() => {
        return filteredStocks.find(s => s.id === selectedStockId) || evaluatedStocks.find(s => s.id === selectedStockId) || filteredStocks[0] || evaluatedStocks[0] || null;
      }, [filteredStocks, evaluatedStocks, selectedStockId]);

      // 系統狀態記憶碼生成 (包含所屬帳號名稱與自訂停損規則)
      const stateSnapshotCode = useMemo(() => {
        const itemsStr = evaluatedStocks
          .map(s => `{帳號:${getAccountName(s.accountId)}, ${s.code}_${s.name}, 張數:${s.lots}, 成本:${Number(s.avgCost).toFixed(2)}, 期間最高:${Number(s.updatedHigh).toFixed(2)}, 屬性:${s.mode === "short" ? "短線" : "波段"}, 停損:-${s.customLossPct}%/${s.stopMaType.toUpperCase()}/${s.stopLogicMode.toUpperCase()}}`)
          .join(", ");
        return `[狀態更新] 日期: ${todayDateStr} | 庫存: ${itemsStr}`;
      }, [evaluatedStocks, accounts, todayDateStr]);

      // 解析並載入狀態記憶碼 (相容有帳號或無帳號之記憶碼)
      const handleParseSnapshot = async () => {
        if (!snapshotInput.trim()) {
          alert("請先在輸入框貼上 [狀態更新] 記憶碼！");
          return;
        }
        const regex = /\{(?:帳號:([^,]+),\s*)?([^_,\s]+)_([^,\s]+),\s*張數:([\d.]+),\s*成本:([\d.]+),\s*期間最高:([\d.]+),\s*屬性:(波段|短線)(?:,\s*停損:-?([\d.]+)%\/([A-Za-z0-9]+)(?:\/([A-Za-z]+))?)?\}/g;
        const matches = [...snapshotInput.matchAll(regex)];
        if (matches.length === 0) {
          alert("⚠️ 格式解析失敗！請確認貼上的是完整的 [狀態更新] 記憶碼。");
          return;
        }

        const nextAccList = [...accounts];
        const findOrCreateAccId = (accNameRaw) => {
          if (!accNameRaw) return nextAccList[0]?.id || "acc_main";
          const cleanAccName = accNameRaw.trim();
          const existing = nextAccList.find(a => a.name === cleanAccName);
          if (existing) return existing.id;
          const newId = "acc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
          nextAccList.push({ id: newId, name: cleanAccName });
          return newId;
        };

        const parsedList = matches.map((m, idx) => {
          const [, accName, code, rawName, lotsStr, costStr, highStr, modeStr, customPctStr, maTypeStr, logicStr] = m;
          const cleanCode = code.trim().toUpperCase();
          const isShort = modeStr === "短線";
          const correctName = BUILTIN_STOCK_DIR[cleanCode] || stockDict[cleanCode] || rawName.trim();
          const accId = findOrCreateAccId(accName);

          return normalizeStockItem({
            id: `${cleanCode}_${Date.now()}_${idx}`,
            accountId: accId,
            code: cleanCode,
            name: correctName,
            lots: parseFloat(lotsStr),
            avgCost: parseFloat(costStr),
            prevHigh: parseFloat(highStr),
            mode: isShort ? "short" : "swing",
            stopLossPct: customPctStr ? parseFloat(customPctStr) : (isShort ? 5.0 : 8.0),
            stopMaType: maTypeStr ? maTypeStr.toLowerCase() : "ma20",
            stopLogicMode: logicStr ? logicStr.toLowerCase() : "or"
          }, idx);
        });

        setAccounts(nextAccList);
        setStocks(parsedList);
        setSelectedStockId(parsedList[0].id);
        setSnapshotInput("");
        setSyncBannerMsg(`✅ 已成功還原 ${parsedList.length} 檔庫存與帳號分類，正在自動聯網同步最新收盤價、均線、營收與新聞...`);

        setIsSyncingAll(true);
        const syncedList = [];
        for (const item of parsedList) {
          const updated = await fetchSingleStockMarketData(item);
          syncedList.push(updated);
        }
        setStocks(syncedList);
        setIsSyncingAll(false);
        setSyncBannerMsg(`✅ 記憶碼還原並完成 ${syncedList.length} 檔最新盤後行情與基本面同步！`);
      };

      const updateSelectedStockField = (field, value) => {
        if (!selectedStock) return;
        setStocks(prev => prev.map(s => (s.id === selectedStock.id ? { ...s, [field]: value } : s)));
      };

      const updateStockRuleById = (id, field, value) => {
        setStocks(prev => prev.map(s => (s.id === id ? { ...s, [field]: value } : s)));
      };

      const fullMarkdownReport = useMemo(() => {
        const titleScope = activeAccountId === "ALL" ? "全部帳號總覽" : getAccountName(activeAccountId);
        const rows = filteredStocks
          .map(s => `| ${getAccountName(s.accountId)} | ${s.code} ${s.name} | ${s.lots} | ${s.avgCost.toFixed(2)} | ${s.todayClose.toFixed(2)} | ${s.updatedHigh.toFixed(2)} | ${s.pnlPct >= 0 ? "+" : ""}${s.pnlPct.toFixed(2)}% | ${s.defenseLinePrice.toFixed(2)} (${s.defenseLineLabel}) | **${s.actionCommand}** (${s.actionSubTag}) |`)
          .join("\n");

        const diagSections = filteredStocks.map(s => {
          const newsMd = (s.newsItems || []).map(n => `    - [${n.title}](${n.link}) (${n.pubDate})`).join("\n");
          return `### 【${getAccountName(s.accountId)}｜${s.code} ${s.name}】— 多空總評分：${s.totalScore.toFixed(1)} / 10 分
- **📊 籌碼面透視**：
  * **法人動向**：${s.institutionalNote}
  * **資券與借券**：${s.marginNote}
  * **主力/分點**：${s.branchNote}
- **📈 技術面結構**：今日收盤 ${s.todayClose.toFixed(2)} 元 | 5MA: ${s.ma5.toFixed(2)} | 10MA: ${s.ma10.toFixed(2)} | 20MA(月線): ${s.ma20.toFixed(2)} | 60MA(季線): ${s.ma60.toFixed(2)}
- **📰 基本面、財報與消息解讀**：
  * **每月營收**：${s.revenueNote}
  * **財報與估值**：${s.epsNote}
  * **題材與紀律解讀**：${s.fundamentalNote}
  * **最新相關新聞**：\n${newsMd || "    - 尚無新聞"}

#### ⚡ 【${s.code} ${s.name}】冷酷風控官的明日操作劇本
- **🧠 紀律當頭棒喝**：${s.actionReason}
- **🎯 明日實戰三劇本**：
  * **🟢 強勢進攻 / 續抱條件**：若明日開盤守穩 5MA (${s.ma5.toFixed(2)} 元) 且帶量突破今日高點 ${s.todayHigh.toFixed(2)} 元，紀律續抱。
  * **🟡 逢高調節 / 停利條件**：若明日衝高至 ${(Math.max(s.updatedHigh, s.todayClose * 1.03)).toFixed(2)} 元附近出現爆量長上影線，逢高減碼 1/3 ~ 1/2。
  * **🔴 鐵血停損 / 清倉條件**：若盤中或收盤跌破防守底線 \`${s.defenseLinePrice.toFixed(2)}\` 元，請無條件執行砍單！`;
        }).join("\n\n---\n\n");

        return `---
## 📋 一、 個人庫存風控儀表板 (${titleScope})
| 帳號分類 | 股號/名稱 | 張數 | 平均成本 | 今日收盤 | 期間最高價 | 帳面損益(%) | 目前防守底線 (觸發價) | 系統強制指令 |
| :--- | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
${rows}

## 🔍 二、 個股四維度深度診斷 & ⚡ 三、 明日操作劇本
${diagSections}

## 💾 四、 系統狀態記憶碼 (State Snapshot)
\`${stateSnapshotCode}\`
---`;
      }, [filteredStocks, activeAccountId, accounts, stateSnapshotCode]);

      const getPnLColor = (val) => {
        if (val > 0) return colorStyle === "tw" ? "text-rose-400" : "text-emerald-400";
        if (val < 0) return colorStyle === "tw" ? "text-emerald-400" : "text-rose-400";
        return "text-slate-300";
      };

      const getCommandBadgeStyle = (type) => {
        switch (type) {
          case "stop_loss":
            return "bg-rose-950/90 text-rose-300 border-rose-500 font-black animate-pulse shadow-lg shadow-rose-950/50";
          case "take_profit":
            return "bg-amber-950/80 text-amber-300 border-amber-500 font-bold";
          case "chip_veto":
            return "bg-orange-950/80 text-orange-300 border-orange-500 font-bold";
          default:
            return "bg-emerald-950/60 text-emerald-300 border-emerald-500/40 font-semibold";
        }
      };

      const handleCopyText = (text, type) => {
        navigator.clipboard.writeText(text);
        setCopiedType(type);
        setTimeout(() => setCopiedType(null), 2000);
      };

      return (
        <div className="max-w-7xl mx-auto p-3 md:p-6 space-y-5">
          {/* 頂部 Header */}
          <header className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div>

                      <div className="font-bold text-rose-400 text-sm">🔴 鐵血停損 / 清倉條件</div>
                      <p className="text-slate-200 leading-relaxed">
                        若盤中或收盤跌破目前防守底線 <span className="font-mono font-black text-rose-400 underline">{selectedStock.defenseLinePrice.toFixed(2)} 元</span> ({selectedStock.defenseLineLabel})，無條件市價砍單清倉，絕不留戀！
                      </p>
                    </div>
                  </div>
                </section>
              )}

              {/* 💾 四、系統狀態記憶碼與備份中心 */}
              <section className="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h2 className="text-xs md:text-sm font-bold text-slate-200 flex items-center gap-2">
                    <span>💾</span> 四、系統狀態記憶碼 & 多帳號備份還原中心
                  </h2>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleExportBackupFile}
                      className="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 rounded-lg text-xs font-bold text-emerald-300 transition"
                    >
                      💾 下載 .json 備份檔
                    </button>
                    <button
                      onClick={() => handleCopyText(stateSnapshotCode, "snap")}
                      className="px-3.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 rounded-lg text-xs font-bold text-amber-300 transition"
                    >
                      {copiedType === "snap" ? "✅ 已複製狀態記憶碼！" : "📋 複製狀態記憶碼"}
                    </button>
                  </div>
                </div>

                <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-amber-200/90 break-all select-all">
                  {stateSnapshotCode}
                </div>

                <div className="flex flex-col sm:flex-row gap-2 pt-1">
                  <input
                    type="text"
                    value={snapshotInput}
                    onChange={e => setSnapshotInput(e.target.value)}
                    placeholder="在此貼上 [狀態更新] 記憶碼字串，點擊右側按鈕即可一鍵還原所有帳號與庫存..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500"
                  />
                  <button
                    onClick={handleParseSnapshot}
                    className="px-4 py-2 bg-amber-600/25 hover:bg-amber-600/40 border border-amber-500/40 text-amber-300 rounded-lg text-xs font-bold whitespace-nowrap transition"
                  >
                    📥 解析記憶碼並抓價
                  </button>
                </div>
              </section>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
